# SPDX-License-Identifier: MPL-2.0
name: Basic Julia Test
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1.6'
      - run: |
          julia -e 'println("Julia version: ", VERSION)'