# SPDX-License-Identifier: MPL-2.0
name: Julia Setup Test
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - run: julia -e 'println("Julia setup successful: ", VERSION)'